<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>WeatherApp</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="icon" href="./public/icons/favicon.svg" type="image/svg+xml" />
    <script type="module" src="./scripts/script.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a
          href="#"
          class="header__logo"
          aria-label="Перейти на главную страницу WeatherApp"
        >
          <picture>
            <source
              media="(max-width: 1023px)" 
              srcset="./public/icons/logo-tablet-mobile.svg"
            >
            <img
              src="./public/icons/logo.svg"
              alt="Логотип"
              class="header__logo-image"
              width="192"
              height="48"
              loading="eager"
            />
          </picture>
        </a>
        <form class="header__search search">
          <label class="search__label visually-hidden" for="search"
            >Поиск</label
          >
          <input
            class="search__input"
            type="search"
            id="search"
            placeholder="Поиск по городу"
            autocomplete="off"
          />
          <img
            class="search__icon"
            src="./public/icons/search.svg"
            alt=""
            width="24"
            height="24"
          />
          <button
            type="button"
            id="search-clear-button"
            class="search__clear-button"
            aria-label="Очистить поиск"
            title="Очистить поиск"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4.65041 5.95141C4.2912 5.59221 4.29119 5.00983 4.65039 4.65062C5.00958 4.29141 5.59197 4.2914 5.95118 4.65059L19.3496 18.0485C19.7088 18.4077 19.7088 18.9901 19.3496 19.3493C18.9904 19.7085 18.408 19.7086 18.0488 19.3494L4.65041 5.95141Z"
              />
              <path
                d="M4.65084 19.3496C4.29163 18.9904 4.29161 18.408 4.65081 18.0488L18.0488 4.6504C18.408 4.29119 18.9903 4.29118 19.3496 4.65038C19.7088 5.00957 19.7088 5.59196 19.3496 5.95117L5.95163 19.3496C5.59243 19.7088 5.01005 19.7088 4.65084 19.3496Z"
              />
            </svg>
          </button>
        </form>
      </header>
      <main>
        <h1 class="visually-hidden">Weather App</h1>
        <section class="weather" aria-labelledby="weather-title">
          <h2 id="weather-title" class="visually-hidden">
            Информация о погоде в выбранном городе
          </h2>
          <div class="weather__info">
            
          </div>
          <ul class="weather__cards cards"></ul>
        </section>

        <section class="forecast" aria-labelledby="forecast-title">
          <h2 class="forecast__title" id="forecast-title">Прогноз:</h2>
          <div class="forecast__tabs tabs">
            <ul class="tabs__menu" role="tablist"></ul>
            <div class="tabs__body">
              <div class="tabs__slider slider">
                <button 
                  class="slider__button" 
                  type="button" 
                  aria-label="Назад"
                  title="Назад"
                  disabled
                >
                  <img 
                    class="slider__button-icon"
                    src="./public/icons/arrow-left.svg" 
                    alt=""
                    aria-hidden="true"
                    width="24" height="24"
                  >
                </button>
                <div class="slider__content"></div>
                <button 
                  class="slider__button" 
                  type="button"
                  aria-label="Вперед"
                  title="Вперед"
                >
                  <img 
                    class="slider__button-icon"
                    src="./public/icons/arrow-right.svg" 
                    alt="" 
                    aria-hidden="true"
                    width="24" height="24"
                  >
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__rights">
          Проект выполнен в рамках стажировки
          <a
            class="footer__link"
            href="https://preax.ru"
            target="_blank"
            rel="noopener noreferrer"
          >
            PREAX
          </a>
        </p>
      </footer>
    </div>
  </body>
</html>

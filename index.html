<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <title>WeatherApp</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="./data.js" defer></script>
    <script src="./scripts/script.js" defer></script>
  </head>
  <body>
      <div class="container">
        <header class="header">
            <a href="#" class="header__logo">
            <img
                src="./public/icons/logo.svg"
                alt="logo"
                class="header__logo-image"
                width="192" height="48"
            />
            </a>
            <form class="header__search search">
              <label class="search__label visually-hidden" for="search">Поиск</label>
              <input
                  class="search__input"
                  type="search"
                  id="search"
                  placeholder="Поиск по городу"
                  autocomplete="off"
              />
              <button type="button" class="search__clear-button hidden" aria-label="Очистить поиск">
                <img class="search__clear-button-icon" src="./public/icons/close.svg" alt="">
              </button>
            </form>
        </header>
        <main>
            <h1 class="visually-hidden">Weather App</h1>
            <section class="weather">
              <h2 class="visually-hidden">Информация о погоде в выбранном городе</h2>
              <div class="weather__info">
                <div class="weather__current">
                    <div class="weather__city">Москва</div>
                    <div class="weather__date">
                        Суббота, <time datetime="--01-06">06 января</time>
                    </div>
                    <div class="weather__time">
                        <time datetime="11:29">11:29</time>
                    </div>
                </div>
                <div class="weather__temperature">-7°</div>
                <div class="weather__other">
                  <div class="weather__details">
                      <img 
                          src="./public/icons/broken-clouds.svg" 
                          alt="" 
                          class="weather__icon"
                      >
                      <div class="weather__condition">Облачно</div>
                  </div>
                  <div class="weather__perceived-temperature">Ощущается как -11°</div>
                </div>
              </div>
              <ul class="weather__cards-list cards"></ul>
            </section>
            <section class="slider"></section>
        </main>
        <footer class="footer"></footer>
      </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="./public/styles/main.css">
    <link rel="icon" href="./public/icons/favicon.svg" type="image/svg+xml">
    <script type="module" src="./scripts/script.js"></script>
  </head>
  <body>
      <div class="container">
        <header class="header">
            <a href="#" class="header__logo">
            <img
                src="./public/icons/logo.svg"
                alt="Логотип"
                class="header__logo-image"
                width="192" height="48"
            >
            </a>
            <form class="header__search search">
              <label class="search__label visually-hidden" for="search">Поиск</label>
              <input
                  class="search__input"
                  type="search"
                  id="search"
                  placeholder="Поиск по городу"
                  autocomplete="off"
              >
              <img 
                class="search__icon"
                src="./public/icons/search.svg" 
                alt="" 
                width="24" 
                height="24"
              >
              <button type="button" class="search__clear-button hidden" aria-label="Очистить поиск">
                <!-- <img 
                  class="search__clear-button-icon" 
                  src="./public/icons/close.svg" 
                  alt=""
                  width="24" height="24"
                > -->

                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4.65041 5.95141C4.2912 5.59221 4.29119 5.00983 4.65039 4.65062C5.00958 4.29141 5.59197 4.2914 5.95118 4.65059L19.3496 18.0485C19.7088 18.4077 19.7088 18.9901 19.3496 19.3493C18.9904 19.7085 18.408 19.7086 18.0488 19.3494L4.65041 5.95141Z"/>
                  <path d="M4.65084 19.3496C4.29163 18.9904 4.29161 18.408 4.65081 18.0488L18.0488 4.6504C18.408 4.29119 18.9903 4.29118 19.3496 4.65038C19.7088 5.00957 19.7088 5.59196 19.3496 5.95117L5.95163 19.3496C5.59243 19.7088 5.01005 19.7088 4.65084 19.3496Z"/>
                </svg>
              </button>
            </form>
        </header>
        <main>
            <h1 class="visually-hidden">Weather App</h1>
            <section class="weather">
              <h2 class="visually-hidden">Информация о погоде в выбранном городе</h2>
              <div class="weather__info">
                <div class="weather__current">
                    <h3 class="weather__city">Москва</h3>
                    <p class="weather__date">
                        Суббота, <time datetime="2026-01-06">06 января</time>
                    </p>
                    <p class="weather__time">
                        <time datetime="11:29">11:29</time>
                    </p>
                </div>
                <p class="weather__temperature"><span class="visually-hidden">Температура воздуха</span>-7°</p>
                <div class="weather__other">
                  <div class="weather__details">
                      <img 
                          src="./public/icons/broken-clouds.svg" 
                          alt="" 
                          class="weather__icon"
                          width="24" height="24"
                      >
                      <p class="weather__condition">Облачно</p>
                  </div>
                  <p class="weather__perceived-temperature">Ощущается как -11°</p>
                </div>
              </div>
              <ul class="cards"></ul>
            </section>
            <section class="slider"></section>
        </main>
        <footer class="footer"></footer>
      </div>
  </body>
</html>
